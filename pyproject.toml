[project]
name = "chess-position-recognition"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
    "tabulate>=0.9.0",
    "torch>=2.14.1",
]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "ty>=0.0.91",
]
docs = ["zensical>=0.0.71"]

[tool.ruff]
line-length = 120
target-version = "py312"
lint.select = ["E", "F", "I", "UP"]
